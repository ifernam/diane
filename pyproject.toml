[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diane"
authors = [{name = "ifernam"}]
description = "Human activities tracker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pyyaml",
    "pydantic_settings",
    "tzlocal",
    "portion"
]

[project.optional-dependencies]
dev = [
    "basedpyright",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]

#[project.scripts]
#diane = "diane.cli:app"

[tool.basedpyright]
typeCheckingMode = "all"
reportImplicitStringConcatenation = false
stubPath = "stubs"

[tool.ruff]
target-version = "py312"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
